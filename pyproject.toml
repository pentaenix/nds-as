[project]
name = "rae"
version = "0.26.0"
description = "RAE (Retro Asset Extractor): local ROM asset studio for Nintendo DS and future platforms"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "trimesh>=4.0",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "Pillow>=10.0",
]

[project.scripts]
rae = "rae.cli:main"
rae-ui = "rae.app:main"
dsas = "rae.cli:main"
dsas-ui = "rae.app:main"

[tool.setuptools.packages.find]
where = ["src"]
