[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rae"
version = "0.26.0"
description = "RAE (Retro Asset Extractor): local ROM asset studio for Nintendo DS and future platforms"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "trimesh>=4.0",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
preview = [
    "PySide6-Addons>=6.6",
]

[project.scripts]
rae = "rae.cli:main"
rae-ui = "rae.app:main"
dsas = "rae.cli:main"
dsas-ui = "rae.app:main"

[tool.setuptools]
package-dir = {"rae" = "src", "dsm" = "src/dsm"}

[tool.setuptools.package-data]
"rae.ui.preview" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "nds: Nintendo DS island tests only",
    "threeds: Nintendo 3DS island tests only",
    "gba: Game Boy Advance island tests only",
    "switch: Nintendo Switch island tests only",
    "mobile: Mobile/HOME island tests only",
    "core_shared: Shared core / contract tests (run when touching dispatch or glb_policy classify)",
]
